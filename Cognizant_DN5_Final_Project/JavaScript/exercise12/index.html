<!DOCTYPE html>
<html>
<body>

<button onclick="sendData()">
Send
</button>

<script>

function sendData(){

setTimeout(() => {

fetch("https://jsonplaceholder.typicode.com/posts",{
method:"POST",
body:JSON.stringify({
name:"Prabha"
}),
headers:{
"Content-Type":"application/json"
}
})
.then(response => response.json())
.then(data => alert("Success"))
.catch(error => alert("Failed"));

},2000);

}

</script>

</body>
</html>
