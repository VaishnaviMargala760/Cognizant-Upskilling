<!DOCTYPE html>
<html>

<body onbeforeunload="return warning();">

<video width="400"
controls
oncanplay="videoReady()">

<source src="movie.mp4" type="video/mp4">

</video>

<p id="msg"></p>

<script>

function videoReady(){

document.getElementById("msg").innerHTML =
"Video ready to play";

}

function warning(){

return "Form not completed";

}

</script>

</body>

</html>
